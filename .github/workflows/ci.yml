name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  infrastructure:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: production
      POSTGRES_PASSWORD: compose-validation-only
      # Compose syntax checks only; no runtime account or secret is used here.
      ADMIN_USERNAME: ci-validation
      ADMIN_PASSWORD_HASH: ci-syntax-validation-only
      SESSION_SECRET: ci-syntax-validation-only-not-a-session-secret
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example -f docker-compose.yml -f compose.production.yml config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.yml -f compose.production.yml config --format json | python3 scripts/tests/production-compose-test.py
      - run: docker compose --env-file .env.example -f docker-compose.yml -f compose.production.yml config --format json | python3 scripts/tests/production-compose-test.py
        env:
          FX_REFERENCE_SYNC_ENABLED: 'true'
          FX_REFERENCE_SYNC_INTERVAL_SECONDS: '3600'
      - run: bash -n scripts/lib/*.sh scripts/*.sh scripts/tests/*.sh
      - run: bash scripts/tests/backup-common-test.sh
