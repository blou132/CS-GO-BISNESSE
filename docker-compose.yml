name: cs2-arbitrage-hub

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs2}
      POSTGRES_USER: ${POSTGRES_USER:-cs2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cs2}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cs2}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SYNC_TTL_SECONDS: ${SYNC_TTL_SECONDS:-300}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-3600}
      VERY_STALE_AFTER_SECONDS: ${VERY_STALE_AFTER_SECONDS:-86400}
      PRICE_OBSERVATION_MIN_INTERVAL_SECONDS: ${PRICE_OBSERVATION_MIN_INTERVAL_SECONDS:-3600}
      MARKET_SYNC_ENABLED: ${MARKET_SYNC_ENABLED:-false}
      MARKET_SYNC_QUERY: ${MARKET_SYNC_QUERY:-}
      CSFLOAT_SYNC_INTERVAL_SECONDS: ${CSFLOAT_SYNC_INTERVAL_SECONDS:-900}
      SKINPORT_SYNC_INTERVAL_SECONDS: ${SKINPORT_SYNC_INTERVAL_SECONDS:-900}
      DMARKET_SYNC_INTERVAL_SECONDS: ${DMARKET_SYNC_INTERVAL_SECONDS:-900}
      MAX_LISTINGS: ${MAX_LISTINGS:-500}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      CSFLOAT_API_KEY: ${CSFLOAT_API_KEY:-}
      DMARKET_PUBLIC_KEY: ${DMARKET_PUBLIC_KEY:-}
      DMARKET_SECRET_KEY: ${DMARKET_SECRET_KEY:-}
      FX_USD_EUR_RATE: ${FX_USD_EUR_RATE:-}
      FX_RATE_SOURCE: ${FX_RATE_SOURCE:-}
      FX_RATE_TIMESTAMP: ${FX_RATE_TIMESTAMP:-}
      FX_MAX_AGE_HOURS: ${FX_MAX_AGE_HOURS:-72}
    command: [sh, -c, 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000']
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
