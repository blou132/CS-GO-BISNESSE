[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cs2-arbitrage-api"
version = "0.2.0"
description = "API privée de comparaison des marchés CS2"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3", "httpx[brotli]>=0.28,<1", "pynacl>=1.5,<2",
  "python-socketio[asyncio-client]>=5.16,<6", "msgpack>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "unit: offline unit and fixture contract tests",
  "integration: isolated local HTTP or database integration tests",
  "live: external provider tests; explicit opt-in required",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
